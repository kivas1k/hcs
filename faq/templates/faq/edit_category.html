{% extends "base.html" %}

{% block title %}{{ form.instance.pk|yesno:"Редактировать,Добавить" }} категорию - ЖКХ Сервис{% endblock %}

{% block content %}
<div class="auth-form">
    <h2>{{ form.instance.pk|yesno:"Редактировать,Добавить" }} категорию</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'faq:faq' %}" class="btn btn-outline">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
